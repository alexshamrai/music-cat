spring:
  datasource:
    url: jdbc:h2:file:./data/music-library;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

music-library:
  catalog-path: ../catalog/catalog.json

server:
  port: 8080
