spring:
  datasource:
    url: jdbc:h2:file:./data/music-cat;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

music-cat:
  catalog-path: ../catalog.json
  sheets:
    enabled: false
    credentials-path: ${SHEETS_CREDENTIALS_PATH:../config/google-credentials.json}
    spreadsheet-id: ${SHEETS_SPREADSHEET_ID:}

server:
  port: 8080
